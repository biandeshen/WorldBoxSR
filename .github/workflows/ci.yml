name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test
      - run: npm run smoke
      - run: npm run pages:build
      - run: npm run pages:check
