name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: grazer-turnover-stage3
          path: tmp-research/grazer-turnover-stage3.json
      - run: npm run smoke
