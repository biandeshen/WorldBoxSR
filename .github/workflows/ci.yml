name: ci

on:
  push:
    branches: [main]
  pull_request:

# PR correctness only needs to certify the newest revision. Keep main pushes
# independent while cancelling stale PR runs after a newer commit arrives.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test
      - run: npm run smoke
      - run: npm run pages:build
      - run: npm run pages:check
