name: visual-qa

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'client/**'
      - 'engine/**'
      - 'content/**'
      - 'package.json'
      - 'vite.config.js'
      - 'tools/capture-visual-evidence.sh'
      - 'tools/capture-meteor-evidence.mjs'
      - 'tools/capture-story-evidence.mjs'
      - 'tools/capture-focused-story-evidence.mjs'
      - 'tools/capture-bookmark-evidence.mjs'
      - 'tools/capture-chronicle-lenses-evidence.mjs'
      - 'tools/capture-world-stories-gate.mjs'
      - 'tools/run-world-stories-gate.sh'
      - 'tools/capture-natural-fauna-evidence.mjs'
      - 'tools/capture-multi-species-evidence.mjs'
      - 'tools/capture-wolf-predation-evidence.mjs'
      - 'tools/capture-ecology-readability-evidence.mjs'
      - 'tools/capture-canonical-ecology-evidence.mjs'
      - 'tools/capture-scenario-setup-evidence.mjs'
      - 'tools/capture-scenario-portability-evidence.mjs'
      - 'tools/capture-scenario-replay-fork-evidence.mjs'
      - 'tools/capture-canonical-scenario-builder-evidence.mjs'
      - 'tools/capture-ruling-line-readability-evidence.mjs'
      - 'tools/capture-dynastic-world-stories-evidence.mjs'
      - 'tools/capture-touch-inspect-evidence.mjs'
      - 'tools/run-touch-inspect-smoke.sh'
      - 'tools/capture-renderer-recovery-evidence.mjs'
      - 'tools/run-renderer-recovery-smoke.sh'
      - 'tools/capture-stable-sandbox-persistence-evidence.mjs'
      - 'tools/run-stable-sandbox-smoke.sh'
      - 'tools/verify-stable-sandbox-evidence.mjs'
      - 'tools/capture-settlement-food-reserve-evidence.mjs'
      - 'tools/run-settlement-food-reserve-smoke.sh'
      - 'tools/self-hosted-runner-preflight.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

# A single project runner should spend time only on the newest revision of a PR.
# Pushes to main use their ref as the stable full-gate key.
concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshot:
    # TEMPORARY QA BRANCH ONLY: #332 exists solely to cancel its stale
    # self-hosted PR lane after the real repair merged via #331. Never merge
    # this workflow override; merged-main visual-qa is the authoritative gate.
    if: ${{ false }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      VISUAL_QA_SCOPE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reusable self-hosted environment
        run: node tools/self-hosted-runner-preflight.mjs
      - name: Install browser toolchain
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Capture runtime and screenshots
        shell: powershell
        run: |
          & "$env:WORLDBOXSR_BASH" tools/capture-visual-evidence.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify settlement reserve product surface
        shell: powershell
        run: |
          & "$env:WORLDBOXSR_BASH" tools/run-settlement-food-reserve-smoke.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify mobile touch inspection
        shell: powershell
        run: |
          & "$env:WORLDBOXSR_BASH" tools/run-touch-inspect-smoke.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify renderer failure recovery
        shell: powershell
        run: |
          & "$env:WORLDBOXSR_BASH" tools/run-renderer-recovery-smoke.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify stable sandbox composition
        shell: powershell
        run: |
          & "$env:WORLDBOXSR_BASH" tools/run-stable-sandbox-smoke.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize visual gate
        if: always()
        shell: powershell
        run: |
          $lines = @(
            '## Visual QA',
            '',
            "- Scope: ``$env:VISUAL_QA_SCOPE``.",
            '- Browser-heavy evidence executed on the reusable Windows/X64 self-hosted project runner after an explicit environment preflight.',
            '- Stale Visual QA runs for the same PR are cancelled so the project runner validates only the newest revision.',
            '- Fork PR code is never executed directly on the project-owned runner.',
            '- GitHub-hosted `ci.yml` remains the independent clean-room unit/build baseline.',
            '- Production Vite build served through the real project-site base path.',
            '- Headless Chromium must confirm a fully warmed Phaser showcase; `Renderer failed` must be absent.',
            '- Settlement Food Reserves must show two naturally different active reserve ratios, distinct map Granary signatures and a matching Inspector line without evidence-time reserve mutation.',
            '- Mobile-emulated Chromium must prove short tap uses the selected power while long hold inspects without consuming another command, and two-finger pinch preserves authority/focus.',
            '- Fault-injected Chromium must block the built Phaser app chunk, expose explicit Retry + Compatibility actions, and start the existing Legacy renderer from the Compatibility action.',
            '- Stable Sandbox evidence must prove ordinary Save → authoritative divergence → exact paused Restore → Scenario persistence suppression through existing production UI.'
          )
          if ($env:VISUAL_QA_SCOPE -eq 'smoke') {
            $lines += '- PR smoke keeps canonical + Legacy 1440×900 screenshots, real Meteor→Rain pointer recovery, causal World Stories navigation, real Scenario Setup interaction, v1.1 reserve evidence, mobile touch/pinch, renderer recovery, and the focused Stable Sandbox persistence journey.'
            $lines += '- Full historical v0.4–v1.0 Chromium regression plus final stable-sandbox composition remains mandatory after merge on `main`.'
          } else {
            $lines += '- Full historical v0.4–v1.0 regression remains mandatory together with the current v1.1 reserve surface.'
          }
          $lines += '- Artifact `visual-evidence` records the executed scope and reproducible screenshots/JSON evidence.'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
