name: visual-qa

on:
  pull_request:
    paths:
      - 'client/**'
      - 'engine/**'
      - 'content/**'
      - 'package.json'
      - 'vite.config.js'
      - 'tools/capture-visual-evidence.sh'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser toolchain
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Capture runtime and screenshots
        run: bash tools/capture-visual-evidence.sh
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: artifacts/visual
          retention-days: 14
      - name: Summarize visual gate
        run: |
          {
            echo '## Visual QA'
            echo ''
            echo '- Production Vite build served through the project-site base path.'
            echo '- Headless Chromium confirmed the Phaser runtime readiness marker.'
            echo '- `Renderer failed` was absent from the rendered DOM.'
            echo '- Artifact `visual-evidence` contains fixed 1440×900 Phaser and legacy screenshots for seed 45.'
          } >> "$GITHUB_STEP_SUMMARY"
