name: visual-qa

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'client/**'
      - 'engine/**'
      - 'content/**'
      - 'package.json'
      - 'vite.config.js'
      - 'tools/capture-visual-evidence.sh'
      - 'tools/capture-meteor-evidence.mjs'
      - 'tools/capture-story-evidence.mjs'
      - 'tools/capture-focused-story-evidence.mjs'
      - 'tools/capture-bookmark-evidence.mjs'
      - 'tools/capture-chronicle-lenses-evidence.mjs'
      - 'tools/capture-world-stories-gate.mjs'
      - 'tools/run-world-stories-gate.sh'
      - 'tools/capture-natural-fauna-evidence.mjs'
      - 'tools/capture-multi-species-evidence.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser toolchain
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Capture runtime and screenshots
        run: bash tools/capture-visual-evidence.sh
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize visual gate
        if: always()
        run: |
          {
            echo '## Visual QA'
            echo ''
            echo '- Production Vite build served through the real project-site base path.'
            echo '- Headless Chromium must confirm a fully warmed Phaser showcase; `Renderer failed` must be absent.'
            echo '- v0.4 Meteor→Rain real-pointer damage/recovery regression remains required.'
            echo '- v0.5 Event Card / Focused Story / Watchlist / Chronicle-lens / canonical one-session story regressions remain required.'
            echo '- v0.6 natural fauna: Sandbox remains default/exact; Living Ecology is selected through the visible Mode control, uses validated 24×24 natural grazers, retains natural birth, has zero god founder spawns and supports authority-neutral Grazer inspection.'
            echo '- v0.6 multi-species surface: on a paused Living Ecology world, one Wolf is explicitly spawned through the authoritative hidden QA creature-spawn path; Grazer and Wolf must have distinct EntityLayer visual signatures, species-aware inspectors and a compact Wolf HUD count, while post-spawn inspection remains read-only.'
            echo '- Artifact `visual-evidence` preserves fixed Phaser/legacy screenshots, prior release regressions, Living Ecology natural-fauna and Grazer/Wolf mixed-species evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
