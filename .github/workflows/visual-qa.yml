name: visual-qa

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'client/**'
      - 'engine/**'
      - 'content/**'
      - 'package.json'
      - 'vite.config.js'
      - 'tools/capture-visual-evidence.sh'
      - 'tools/capture-meteor-evidence.mjs'
      - 'tools/capture-story-evidence.mjs'
      - 'tools/capture-focused-story-evidence.mjs'
      - 'tools/capture-bookmark-evidence.mjs'
      - 'tools/capture-chronicle-lenses-evidence.mjs'
      - 'tools/capture-world-stories-gate.mjs'
      - 'tools/run-world-stories-gate.sh'
      - 'tools/capture-natural-fauna-evidence.mjs'
      - 'tools/capture-multi-species-evidence.mjs'
      - 'tools/capture-wolf-predation-evidence.mjs'
      - 'tools/capture-ecology-readability-evidence.mjs'
      - 'tools/capture-canonical-ecology-evidence.mjs'
      - 'tools/capture-scenario-setup-evidence.mjs'
      - 'tools/capture-scenario-portability-evidence.mjs'
      - 'tools/capture-scenario-replay-fork-evidence.mjs'
      - 'tools/capture-canonical-scenario-builder-evidence.mjs'
      - 'tools/capture-ruling-line-readability-evidence.mjs'
      - 'tools/capture-dynastic-world-stories-evidence.mjs'
      - 'tools/capture-touch-inspect-evidence.mjs'
      - 'tools/run-touch-inspect-smoke.sh'
      - 'tools/capture-renderer-recovery-evidence.mjs'
      - 'tools/run-renderer-recovery-smoke.sh'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    env:
      VISUAL_QA_SCOPE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser toolchain
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Capture runtime and screenshots
        run: bash tools/capture-visual-evidence.sh
      - name: Verify mobile touch inspection
        run: bash tools/run-touch-inspect-smoke.sh
      - name: Verify renderer failure recovery
        run: bash tools/run-renderer-recovery-smoke.sh
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize visual gate
        if: always()
        run: |
          {
            echo '## Visual QA'
            echo ''
            echo "- Scope: \`${VISUAL_QA_SCOPE}\`."
            echo '- Production Vite build served through the real project-site base path.'
            echo '- Headless Chromium must confirm a fully warmed Phaser showcase; `Renderer failed` must be absent.'
            echo '- Mobile-emulated Chromium must prove short tap uses the selected power while long hold inspects without consuming another command.'
            echo '- Fault-injected Chromium must block the built Phaser app chunk, expose explicit Retry + Compatibility actions, and start the existing Legacy renderer from the Compatibility action.'
            if [ "$VISUAL_QA_SCOPE" = 'smoke' ]; then
              echo '- PR smoke keeps canonical + Legacy 1440×900 screenshots, real Meteor→Rain pointer recovery, causal World Stories navigation, real Scenario Setup pointer/editor interaction, mobile touch inspection, and renderer failure recovery.'
              echo '- Full historical v0.4–v0.8 Chromium regression remains mandatory after merge on `main`.'
            else
              echo '- v0.4 Meteor→Rain real-pointer damage/recovery regression remains required.'
              echo '- v0.5 Event Card / Focused Story / Watchlist / Chronicle-lens / canonical one-session story regressions remain required.'
              echo '- v0.6 natural fauna, multi-species, Wolf predation, ecology readability and canonical trough→recovery→predation gates remain required.'
              echo '- v0.7 Scenario Setup, portable Scenario, Replay/Fork and canonical Scenario Builder regressions remain required.'
              echo '- v0.8 ruling-line Inspector, Dynastic World Stories and canonical Ruling Lines regressions remain required.'
            fi
            echo '- Artifact `visual-evidence` records the executed scope and reproducible screenshots/JSON evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
