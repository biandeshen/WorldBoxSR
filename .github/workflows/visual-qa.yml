name: visual-qa

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'client/**'
      - 'engine/**'
      - 'content/**'
      - 'package.json'
      - 'vite.config.js'
      - 'tools/capture-visual-evidence.sh'
      - 'tools/capture-meteor-evidence.mjs'
      - 'tools/capture-story-evidence.mjs'
      - 'tools/capture-focused-story-evidence.mjs'
      - 'tools/capture-bookmark-evidence.mjs'
      - 'tools/capture-chronicle-lenses-evidence.mjs'
      - 'tools/capture-world-stories-gate.mjs'
      - 'tools/run-world-stories-gate.sh'
      - 'tools/capture-natural-fauna-evidence.mjs'
      - 'tools/capture-multi-species-evidence.mjs'
      - 'tools/capture-wolf-predation-evidence.mjs'
      - 'tools/capture-ecology-readability-evidence.mjs'
      - 'tools/capture-canonical-ecology-evidence.mjs'
      - 'tools/capture-scenario-setup-evidence.mjs'
      - 'tools/capture-scenario-portability-evidence.mjs'
      - 'tools/capture-scenario-replay-fork-evidence.mjs'
      - 'tools/capture-canonical-scenario-builder-evidence.mjs'
      - 'tools/capture-ruling-line-readability-evidence.mjs'
      - 'tools/capture-dynastic-world-stories-evidence.mjs'
      - 'tools/capture-touch-inspect-evidence.mjs'
      - 'tools/run-touch-inspect-smoke.sh'
      - 'tools/capture-renderer-recovery-evidence.mjs'
      - 'tools/run-renderer-recovery-smoke.sh'
      - 'tools/capture-stable-sandbox-persistence-evidence.mjs'
      - 'tools/run-stable-sandbox-smoke.sh'
      - 'tools/verify-stable-sandbox-evidence.mjs'
      - 'tools/capture-settlement-food-reserve-evidence.mjs'
      - 'tools/self-hosted-runner-preflight.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    # Browser-heavy evidence runs on the reusable project runner. Keep ordinary
    # ci.yml on GitHub-hosted Ubuntu as an independent clean-room baseline.
    runs-on: self-hosted
    env:
      VISUAL_QA_SCOPE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reusable self-hosted environment
        run: node tools/self-hosted-runner-preflight.mjs
      - name: Install browser toolchain
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Capture runtime and screenshots
        run: bash tools/capture-visual-evidence.sh
      - name: Verify settlement reserve product surface
        run: |
          node --check tools/capture-settlement-food-reserve-evidence.mjs
          npm run pages:build
          npx vite preview --host 127.0.0.1 --port 4177 --strictPort > /tmp/worldboxsr-settlement-reserve-qa.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if curl --silent --show-error --fail --max-time 1 http://127.0.0.1:4177/WorldBoxSR/ >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          browser="${WORLDBOXSR_BROWSER:-}"
          if [ -z "$browser" ]; then
            for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
              if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
            done
          fi
          node tools/capture-settlement-food-reserve-evidence.mjs "$browser" http://127.0.0.1:4177/WorldBoxSR/ artifacts/visual
      - name: Verify mobile touch inspection
        run: bash tools/run-touch-inspect-smoke.sh
      - name: Verify renderer failure recovery
        run: bash tools/run-renderer-recovery-smoke.sh
      - name: Verify stable sandbox composition
        run: bash tools/run-stable-sandbox-smoke.sh
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize visual gate
        if: always()
        run: |
          {
            echo '## Visual QA'
            echo ''
            echo "- Scope: \`${VISUAL_QA_SCOPE}\`."
            echo '- Browser-heavy evidence executed on the reusable self-hosted project runner after an explicit environment preflight.'
            echo '- GitHub-hosted `ci.yml` remains the independent clean-room unit/build baseline.'
            echo '- Production Vite build served through the real project-site base path.'
            echo '- Headless Chromium must confirm a fully warmed Phaser showcase; `Renderer failed` must be absent.'
            echo '- Settlement Food Reserves must show two naturally different active reserve ratios, distinct map Granary signatures and a matching Inspector line without evidence-time reserve mutation.'
            echo '- Mobile-emulated Chromium must prove short tap uses the selected power while long hold inspects without consuming another command, and two-finger pinch preserves authority/focus.'
            echo '- Fault-injected Chromium must block the built Phaser app chunk, expose explicit Retry + Compatibility actions, and start the existing Legacy renderer from the Compatibility action.'
            echo '- Stable Sandbox evidence must prove ordinary Save → authoritative divergence → exact paused Restore → Scenario persistence suppression through existing production UI.'
            if [ "$VISUAL_QA_SCOPE" = 'smoke' ]; then
              echo '- PR smoke keeps canonical + Legacy 1440×900 screenshots, real Meteor→Rain pointer recovery, causal World Stories navigation, real Scenario Setup interaction, v1.1 reserve evidence, mobile touch/pinch, renderer recovery, and the focused Stable Sandbox persistence journey.'
              echo '- Full historical v0.4–v1.0 Chromium regression plus final stable-sandbox composition remains mandatory after merge on `main`.'
            else
              echo '- Full historical v0.4–v1.0 regression remains mandatory together with the current v1.1 reserve surface.'
            fi
            echo '- Artifact `visual-evidence` records the executed scope and reproducible screenshots/JSON evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
