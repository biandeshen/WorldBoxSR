name: visual-qa

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'client/**'
      - 'engine/**'
      - 'content/**'
      - 'package.json'
      - 'vite.config.js'
      - 'tools/capture-visual-evidence.sh'
      - 'tools/capture-meteor-evidence.mjs'
      - 'tools/capture-story-evidence.mjs'
      - 'tools/capture-focused-story-evidence.mjs'
      - 'tools/capture-bookmark-evidence.mjs'
      - 'tools/capture-chronicle-lenses-evidence.mjs'
      - 'tools/capture-world-stories-gate.mjs'
      - 'tools/run-world-stories-gate.sh'
      - 'tools/capture-natural-fauna-evidence.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser toolchain
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Capture runtime and screenshots
        run: bash tools/capture-visual-evidence.sh
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize visual gate
        if: always()
        run: |
          {
            echo '## Visual QA'
            echo ''
            echo '- Production Vite build served through the real project-site base path.'
            echo '- Headless Chromium must confirm a fully warmed Phaser showcase; `Renderer failed` must be absent.'
            echo '- v0.4 regression: paused seed45 real-pointer Meteor damage followed by same-footprint Rain capacity restoration remains required.'
            echo '- v0.5 Causal Event Card: real Lightning input creates ruler death → normal succession, then Chromium follows the retained death-event cause and a current map reference with unchanged world authority.'
            echo '- v0.5 Focused Story Trail: on a fresh natural seed45 world, real Chronicle/Event Card clicks Follow one explicit entity reference with >=2 retained events, open a trail event, Clear focus, and preserve the serialized authoritative world fingerprint.'
            echo '- v0.5 Watchlist: one real Chrome tab pins an event + entity, browses away and back, reloads the same tab to prove sessionStorage rehydration, then Unpins/Clears while preserving authority on both sides of reload.'
            echo '- v0.5 Chronicle lenses: real clicks establish Focused Story + Watchlist state, traverse Highlights → Recent → Conflict → Rule, open a non-default Event Card, restore the exact original Highlights IDs, and preserve presentation state + authoritative world fingerprint.'
            echo '- v0.5 canonical product gate: one fresh deterministic seed45 tab uses shipped Lightning to create real ruler death → normal succession, freezes a post-causality baseline, then follows Cause → Map → Pin → Focused Story → lens round-trip through player UI and requires exact Highlights restoration plus unchanged read-only authority.'
            echo '- v0.6 natural fauna: Sandbox remains default/exact; a fresh real browser selects Living Ecology through the visible Mode control, resets into the validated 24×24 natural-grazer config, requires retained natural birth + zero god founder spawns, then Alt-clicks a visible grazer and preserves paused authority.'
            echo '- Artifact `visual-evidence` preserves fixed Phaser/legacy screenshots, v0.4/v0.5 regressions, Living Ecology natural-fauna screenshot and authoritative JSON evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
