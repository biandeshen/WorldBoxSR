name: visual-qa

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'client/**'
      - 'engine/**'
      - 'content/**'
      - 'package.json'
      - 'vite.config.js'
      - 'tools/capture-visual-evidence.sh'
      - 'tools/capture-meteor-evidence.mjs'
      - 'tools/capture-story-evidence.mjs'
      - 'tools/capture-focused-story-evidence.mjs'
      - 'tools/capture-bookmark-evidence.mjs'
      - 'tools/capture-chronicle-lenses-evidence.mjs'
      - 'tools/capture-world-stories-gate.mjs'
      - 'tools/run-world-stories-gate.sh'
      - 'tools/capture-natural-fauna-evidence.mjs'
      - 'tools/capture-multi-species-evidence.mjs'
      - 'tools/capture-wolf-predation-evidence.mjs'
      - 'tools/capture-ecology-readability-evidence.mjs'
      - 'tools/capture-canonical-ecology-evidence.mjs'
      - 'tools/capture-scenario-setup-evidence.mjs'
      - 'tools/capture-scenario-portability-evidence.mjs'
      - 'tools/capture-scenario-replay-fork-evidence.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser toolchain
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Capture runtime and screenshots
        run: bash tools/capture-visual-evidence.sh
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize visual gate
        if: always()
        run: |
          {
            echo '## Visual QA'
            echo ''
            echo '- Production Vite build served through the real project-site base path.'
            echo '- Headless Chromium must confirm a fully warmed Phaser showcase; `Renderer failed` must be absent.'
            echo '- v0.4 Meteor→Rain real-pointer damage/recovery regression remains required.'
            echo '- v0.5 Event Card / Focused Story / Watchlist / Chronicle-lens / canonical one-session story regressions remain required.'
            echo '- v0.6 natural fauna, multi-species, Wolf predation, ecology readability and canonical trough→recovery→predation gates remain required.'
            echo '- v0.7 Scenario Setup: the real existing Phaser pointer path must enter a paused exact Sandbox base, place Human/Grazer/Wolf in ordered Recipe v1 authority, reject one impassable click without identity/world mutation, rename without authority change, Clear by exact rematerialization, rebuild the same start, Run without changing it, then allow ordinary Play to change the world while the frozen recipe stays unchanged.'
            echo '- v0.7 portable Scenario: one authored Recipe must produce canonical Copy Link + downloaded JSON, then fresh shared-link and visible JSON-import Chrome profiles must reproduce the exact same paused authoritative start; one impassable import must fail atomically without changing world, recipe, URL or boot status.'
            echo '- v0.7 Replay/Fork: a fresh shared Scenario must diverge through ordinary Time + Meteor, Replay exact source authority while clearing stale story/selection presentation and retaining bookmark storage, then Fork into the existing Setup workspace, add one real fixed Human action without mutating the source Recipe, and Replay the frozen fork back to its exact start.'
            echo '- Artifact `visual-evidence` preserves prior release regressions plus Scenario Setup/portable/Replay-Fork screenshots, JSON authority evidence and the downloaded canonical Recipe file.'
          } >> "$GITHUB_STEP_SUMMARY"
