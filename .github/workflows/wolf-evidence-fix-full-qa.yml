name: wolf-evidence-fix-full-qa

on:
  pull_request:
    paths:
      - '.github/workflows/wolf-evidence-fix-full-qa.yml'

concurrency:
  group: wolf-evidence-fix-full-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Record validation handoff
        run: |
          echo 'Hosted full historical proof is complete; Windows final proof is owned by merged-main visual-qa.'
