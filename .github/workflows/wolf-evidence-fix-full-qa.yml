name: wolf-evidence-fix-full-qa

on:
  pull_request:
    paths:
      - '.github/workflows/wolf-evidence-fix-full-qa.yml'

# TEMPORARY QA BRANCH ONLY. Intentionally join the stale PR visual-qa
# concurrency group from #332 so this hosted job cancels the already-assigned
# self-hosted smoke without allocating the project Windows runner itself.
# Never merge this workflow; merged-main visual-qa owns the final Windows gate.
concurrency:
  group: visual-qa-332
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Record validation handoff
        run: |
          echo 'Hosted full historical proof is complete; Windows final proof is owned by merged-main visual-qa.'
