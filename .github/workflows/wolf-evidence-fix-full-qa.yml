name: wolf-evidence-fix-full-qa

on:
  push:
    branches:
      - 'fix/wolf-predation-evidence-anchor-pr'

# TEMPORARY CLOSED QA BRANCH ONLY. Join the stale #331 visual concurrency
# group from a real GitHub-hosted job so GitHub can preempt the last queued
# PR smoke without allocating the project Windows runner. Never merge.
concurrency:
  group: visual-qa-331
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Release stale PR runner lane
        run: |
          echo 'Preempt stale visual-qa-331; merged-main visual-qa owns the Windows gate.'
