name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser toolchain
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Build static demo
        run: npm run pages:build
      - name: Verify Pages artifact is the playable demo
        run: npm run pages:check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages URL serves the game
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          body=""
          for attempt in {1..20}; do
            body="$(curl --fail --silent --show-error --location --max-time 15 "$PAGE_URL" || true)"
            if grep -Fq '<title>WorldBoxSR — Playable World</title>' <<<"$body" \
              && grep -Fq 'id="phaser-root"' <<<"$body" \
              && grep -Fq 'id="power-dock"' <<<"$body"; then
              echo "Live Pages demo verified at $PAGE_URL"
              exit 0
            fi
            echo "Attempt $attempt: live Pages content has not converged to the game artifact yet."
            sleep 6
          done
          echo "::error::Live Pages URL does not serve the WorldBoxSR game after deployment: $PAGE_URL"
          printf '%s\n' "$body" | sed -n '1,80p'
          exit 1
