<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0a1118" />
  <title>WorldBoxSR — Playable World</title>
  <link rel="stylesheet" href="./ui.css" />
  <link rel="stylesheet" href="./world_event_pulse.css" />
  <link rel="stylesheet" href="./event_card.css" />
  <link rel="stylesheet" href="./bookmarks.css" />
</head>
<body>
  <div id="phaser-root" aria-label="WorldBoxSR world view"></div>
  <canvas id="game" aria-label="WorldBoxSR legacy world view"></canvas>

  <header id="topbar">
    <div class="brand">
      <strong>WorldBoxSR</strong>
      <small>Playable World</small>
    </div>

    <div id="stats" aria-label="world summary"></div>

    <div id="row">
      <label class="compact-field" title="World seed">
        <span>Seed</span>
        <input id="seed" value="45" size="7" aria-label="seed" />
      </label>
      <button id="reset" type="button" title="Create the showcase world from this seed">↻ World</button>
      <button id="pause" type="button">Ⅱ Pause</button>
      <button id="reset-camera" type="button" title="Fit the world in view">⌂ View</button>
      <label class="compact-field" title="Simulation speed">
        <span>Time</span>
        <select id="speed" aria-label="simulation speed">
          <option value="1">1 day</option>
          <option value="10">10 days</option>
          <option value="60" selected>60 days</option>
          <option value="360">1 year</option>
        </select>
      </label>
    </div>
  </header>

  <aside id="inspector-panel" aria-label="world inspector">
    <div id="boot-status">Starting renderer…</div>
    <div id="inspector">Alt-click a tile or entity to inspect it.</div>

    <details id="timeline">
      <summary>Chronicle</summary>
      <strong id="history-scope-label">World history</strong>
      <div id="history-controls">
        <select id="history-scope" aria-label="history scope">
          <option value="world" selected>World</option>
          <option value="selection">Selection</option>
        </select>
        <select id="history-order" aria-label="history order">
          <option value="newest" selected>Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
      <div id="history-list" aria-label="history events"></div>
      <div id="history-detail">Select an event</div>
    </details>
  </aside>

  <div id="world-event-pulse" role="log" aria-live="polite" aria-label="recent world events"></div>

  <footer id="power-dock">
    <div class="power-dock-title">
      <span>GOD POWERS</span>
      <strong id="tool-readout">Create humans</strong>
    </div>

    <div id="power-buttons" role="toolbar" aria-label="god powers">
      <button class="power-button" type="button" data-tool-button="spawn_human" aria-label="Spawn human" title="Spawn human · key 1">
        <span class="power-icon">✦</span><span class="power-label">Human</span><kbd>1</kbd>
      </button>
      <button class="power-button" type="button" data-tool-button="spawn_grazer" aria-label="Spawn grazer" title="Spawn grazer · key 2">
        <span class="power-icon">🐾</span><span class="power-label">Grazer</span><kbd>2</kbd>
      </button>
      <button class="power-button power-danger" type="button" data-tool-button="erase" aria-label="Erase humans" title="Erase humans · key 3">
        <span class="power-icon">✕</span><span class="power-label">Erase</span><kbd>3</kbd>
      </button>
      <button class="power-button power-electric" type="button" data-tool-button="lightning" aria-label="Lightning" title="Lightning · key 4">
        <span class="power-icon">⚡</span><span class="power-label">Lightning</span><kbd>4</kbd>
      </button>
      <button class="power-button power-danger" type="button" data-tool-button="meteor" aria-label="Meteor" title="Meteor · radius 2 · key 5">
        <span class="power-icon">☄</span><span class="power-label">Meteor</span><kbd>5</kbd>
      </button>
      <button class="power-button power-rain" type="button" data-tool-button="rain" aria-label="Rain" title="Rain · radius 2 · key 6">
        <span class="power-icon">☂</span><span class="power-label">Rain</span><kbd>6</kbd>
      </button>
    </div>

    <select id="tool" class="visually-hidden-select" aria-label="god tool">
      <option value="spawn_human" selected>✦ Spawn human</option>
      <option value="spawn_grazer">🐾 Spawn grazer</option>
      <option value="erase">✕ Erase humans</option>
      <option value="lightning">⚡ Lightning</option>
      <option value="meteor">☄ Meteor · radius 2</option>
      <option value="rain">☂ Rain · radius 2</option>
    </select>

    <div id="hint">Click world: use power · Shift-click: spawn 10 · Drag: pan · Wheel: zoom · Alt-click: inspect</div>
    <a id="renderer-link" href="?renderer=legacy" title="Open the legacy Canvas renderer for comparison">Legacy renderer ↗</a>
  </footer>

  <div id="event-toast" role="status" aria-live="polite"></div>

  <script type="module" src="./presentation/ui_controls.js"></script>
  <script type="module" src="./bootstrap.js"></script>
  <script type="module" src="./presentation/camera_runtime.js"></script>
  <script type="module" src="./presentation/world_overlay_runtime.js"></script>
  <script type="module" src="./presentation/selection_highlight_runtime.js"></script>
  <script type="module" src="./presentation/world_event_pulse_runtime.js"></script>
  <script type="module" src="./presentation/event_card_runtime.js"></script>
</body>
</html>
