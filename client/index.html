<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>worldboxSR prototype</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0e1116; }
    #game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    #hud {
      position: fixed; left: 16px; top: 16px; padding: 12px 14px; border: 1px solid #ffffff22;
      background: #111720dd; border-radius: 10px; backdrop-filter: blur(8px); min-width: 310px;
      box-shadow: 0 8px 30px #0008;
    }
    #row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button, input, select { background: #1d2632; color: #eef3f8; border: 1px solid #ffffff22; border-radius: 6px; padding: 7px 9px; }
    button { cursor: pointer; }
    button:hover { background: #273546; }
    #stats { margin-top: 9px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cbd6e2; }
    #hint { margin-top: 7px; font-size: 12px; color: #91a3b7; max-width: 370px; }
    #inspector { margin-top: 10px; padding-top: 9px; border-top: 1px solid #ffffff18; white-space: pre-wrap; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #d9e4ee; }
    strong { color: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <section id="hud">
    <div id="row">
      <strong>worldboxSR</strong>
      <input id="seed" value="42" size="7" aria-label="seed" />
      <button id="reset">Reset</button>
      <button id="pause">Pause</button>
      <button id="reset-camera">Reset view</button>
      <select id="speed" aria-label="simulation speed">
        <option value="1">1 day/frame</option>
        <option value="10" selected>10 days/frame</option>
        <option value="60">60 days/frame</option>
        <option value="360">1 year/frame</option>
      </select>
    </div>
    <div id="stats"></div>
    <div id="inspector">No selection</div>
    <div id="hint">Click: spawn · Shift-click: spawn 10 · Drag: pan · Wheel: zoom · Right-click / Alt-click / tap: inspect (repeat to cycle targets).</div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
